[project]
name = "ashare-filings"
version = "0.1.0"
description = "中国A股上市公司公告监控与投资策略提示系统"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyPDF2>=3.0",
    "anthropic>=0.40",
    "jieba>=0.42;python_version<'3.12'",
    "rich>=13.0",
]

[project.optional-dependencies]
notify = [
    "apprise>=1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
ashare-filings = "src.main:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
